name: SafeGraph

description: SafeGraph is a geospatial data company that builds and maintains high-quality Point of Interest (POI), building geometry, and geocoded
  address datasets used for location intelligence, site selection, competitive analysis, and machine-learning models. Its core products are Places
  (millions of POIs with base, rich, and premium attributes), Geometry (building-footprint polygons), Address (structured geocoded addresses across
  25+ countries), and Spend (transaction data). Rather than a hosted REST API, SafeGraph delivers data as bulk parquet files via S3, Snowflake,
  AWS Data Exchange, CARTO, Databricks, and ArcGIS. Surfaced originally as a Sapphire Ventures portfolio company and enriched here from SafeGraph's
  public documentation, changelog, and packages.

